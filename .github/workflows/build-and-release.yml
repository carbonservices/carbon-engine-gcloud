name: Build and Release Carbon ESG

on:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Windows Build & Packaging Job
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: Build & Package Windows (NSIS & ZIP)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ninja-build/setup-ninja@v1

      - name: Setup NASM
        shell: bash
        run: |
          choco install nasm -y --no-progress
          echo "C:/Program Files/NASM" >> $GITHUB_PATH

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtpositioning qtwebchannel qthttpserver'
          cache: true

      - name: Determine Dynamic Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            V="${BASH_REMATCH[1]}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v?([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            V="${BASH_REMATCH[1]}"
          else
            V="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=${V}" >> $GITHUB_OUTPUT
          echo "CARBON_ENGINE_VERSION=${V}" >> $GITHUB_ENV

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCARBON_ENGINE_VERSION="${{ steps.ver.outputs.VERSION }}" \
            -DCARBON_ENGINE_DOWNLOAD_MODELS=OFF

      - name: Build Carbon ESG & Carbon Engine
        run: cmake --build build --config Release --parallel

      - name: Package with CPack (NSIS & ZIP)
        shell: bash
        working-directory: build
        run: cpack -C Release -G "NSIS;ZIP"

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            build/CarbonESG-*-Windows-x64.exe
            build/CarbonESG-*-Windows-x64.zip
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # Linux Build & Packaging Job
  # ─────────────────────────────────────────────────────────────
  build-linux:
    name: Build & Package Linux (DEB & TGZ)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libopenblas-dev \
            liblapack-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libtesseract-dev \
            libleptonica-dev \
            libegl1-mesa-dev \
            libglvnd-dev \
            file

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtwebengine qtpositioning qtwebchannel qthttpserver'
          cache: true

      - name: Determine Dynamic Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            V="${BASH_REMATCH[1]}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v?([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            V="${BASH_REMATCH[1]}"
          else
            V="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=${V}" >> $GITHUB_OUTPUT
          echo "CARBON_ENGINE_VERSION=${V}" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCARBON_ENGINE_VERSION="${{ steps.ver.outputs.VERSION }}" \
            -DCARBON_ENGINE_DOWNLOAD_MODELS=OFF

      - name: Build Carbon ESG & Carbon Engine
        run: cmake --build build --config Release --parallel

      - name: Package with CPack (DEB & TGZ)
        working-directory: build
        run: cpack -C Release -G "DEB;TGZ"

      - name: Upload Linux Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            build/CarbonESG-*-Linux-x64.deb
            build/CarbonESG-*-Linux-x64.tar.gz
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # Release Publication Job (Triggered on Tags pushed to master)
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release-artifacts/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: release-artifacts/linux

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Carbon ESG ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/windows/*.exe
            release-artifacts/windows/*.zip
            release-artifacts/linux/*.deb
            release-artifacts/linux/*.tar.gz

